name: FOMC Statement Sniper

on:
  workflow_dispatch:
  schedule:
    # 17h59 UTC les mercredis des réunions FOMC 2026 (13h59 heure de Washington)
    - cron: '59 17 16 9 *'   # 16 Septembre 2026
    - cron: '59 17 28 10 *'  # 28 Octobre 2026
    - cron: '59 17 9 12 *'   # 9 Décembre 2026

jobs:
  snipe-statement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4 resend

      - name: Run Alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python src/analysis/macro_alert.py