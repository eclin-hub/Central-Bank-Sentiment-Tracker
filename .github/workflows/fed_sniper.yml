name: FOMC Statement Sniper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snipe-statement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4 resend

      - name: Run Alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python src/analysis/macro_alert.py